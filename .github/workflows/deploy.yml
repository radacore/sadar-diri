name: deploy

"on":
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test (PHP 8.4 + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sadar_diri_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_mysql, zip, bcmath, exif, pcntl, intl, opcache, sockets, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sadar_diri_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/sadar-diri
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull app queue scheduler
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Hapus HANYA image lama sadar-diri (sisakan latest + yang sedang dipakai).
            # JANGAN: prune tanpa filter, compose down, system prune.
            RUNNING="$(docker inspect sadar-app --format '{{.Image}}' 2>/dev/null || true)"
            docker images "ghcr.io/${{ github.repository }}" --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
              | grep -v -e ':latest' -e "$RUNNING" \
              | awk '{print $2}' | xargs -r docker rmi || true
            docker logout ghcr.io
            docker compose -f docker-compose.prod.yml ps
