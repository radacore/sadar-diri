; Upload limits - lampiran prestasi maks 5MB, impor CSV bisa besar
upload_max_filesize = 50M
post_max_size = 60M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
request_terminate_timeout = 300
max_file_uploads = 20

; Security & logging
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php.log

; Timezone
date.timezone = Asia/Jakarta

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600
